name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Build Project
        run: |
          mkdir -p app/src/main/res/xml app/src/main/java/com/guard/firefoxlock
          python3 -c '
          open("settings.gradle","w").write("pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}}\ndependencyResolutionManagement{repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS);repositories{google();mavenCentral()}}\nrootProject.name=\"FirefoxGuard120\"\ninclude\":app\"\n")
          open("build.gradle","w").write("plugins{id\"com.android.application\"version\"8.2.0\"apply false}\n")
          open("gradle.properties","w").write("android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2048m\n")
          open("app/build.gradle","w").write("plugins{id\"com.android.application\"}\nandroid{namespace\"com.guard.firefoxlock\";compileSdk 34;defaultConfig{applicationId\"com.guard.firefoxlock\";minSdk 24;targetSdk 34;versionCode 1;versionName\"1.0\"};compileOptions{sourceCompatibility JavaVersion.VERSION_17;targetCompatibility JavaVersion.VERSION_17}}\ndependencies{implementation\"androidx.appcompat:appcompat:1.6.1\"}\n")
          c = "android" + chr(58)
          m = "<manifest xmlns" + chr(58) + "android=\"http://android.com\"><application XallowBackup=\"false\" Xlabel=\"FirefoxGuard120\" Xtheme=\"@style/Theme.AppCompat.NoActionBar\"><activity Xname=\".MainActivity\" Xexported=\"true\" XlaunchMode=\"singleTask\" XexcludeFromRecents=\"true\"><intent-filter><action Xname=\"android.intent.action.MAIN\"/><category Xname=\"android.intent.category.LAUNCHER\"/></intent-filter><intent-filter><action Xname=\"android.intent.action.VIEW\"/><category Xname=\"android.intent.category.DEFAULT\"/><category Xname=\"android.intent.category.BROWSABLE\"/><data Xscheme=\"safelock\" Xhost=\"trigger120\"/></intent-filter></activity><service Xname=\".BrowserGuardService\" Xpermission=\"android.permission.BIND_ACCESSIBILITY_SERVICE\" Xexported=\"true\"><intent-filter><action Xname=\"android.accessibilityservice.AccessibilityService\"/></intent-filter><meta-data Xname=\"android.accessibilityservice\" Xresource=\"@xml/service_config\"/></service></application></manifest>"
          open("app/src/main/AndroidManifest.xml","w").write(m.replace("X", c))
          s = "<accessibility-service xmlns" + chr(58) + "android=\"http://android.com\" XaccessibilityEventTypes=\"typeWindowStateChanged\" XaccessibilityFeedbackType=\"feedbackGeneric\" XcanRetrieveWindowContent=\"false\" XnotificationTimeout=\"100\"/>"
          open("app/src/main/res/xml/service_config.xml","w").write(s.replace("X", c))
          '
          printf 'package com.guard.firefoxlock; import android.content.*; import android.graphics.Color; import android.net.Uri; import android.os.*; import android.provider.Settings; import android.view.*; import android.widget.*; import androidx.appcompat.app.AppCompatActivity; public class MainActivity extends AppCompatActivity { private static final long LOCK_MS = 120L * 60L * 1000L; private TextView timerText, statusText; private Button permBtn; private Handler handler = new Handler(); @Override protected void onCreate(Bundle b) { super.onCreate(b); LinearLayout l = new LinearLayout(this); l.setOrientation(LinearLayout.VERTICAL); l.setGravity(Gravity.CENTER); l.setBackgroundColor(Color.parseColor("#1e272e")); l.setPadding(40,40,40,40); TextView ic = new TextView(this); ic.setText("LOCK"); ic.setTextSize(40); ic.setTextColor(Color.WHITE); ic.setGravity(Gravity.CENTER); l.addView(ic); statusText = new TextView(this); statusText.setTextColor(Color.parseColor("#ff4757")); statusText.setTextSize(20); statusText.setGravity(Gravity.CENTER); l.addView(statusText); timerText = new TextView(this); timerText.setTextColor(Color.parseColor("#2ed573")); timerText.setTextSize(42); timerText.setGravity(Gravity.CENTER); l.addView(timerText); permBtn = new Button(this); permBtn.setText("Accessibility Permission ON Karein"); permBtn.setOnClickListener(v -> startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))); l.addView(permBtn); setContentView(l); handleTrigger(getIntent()); startClock(); } @Override protected void onNewIntent(Intent i) { super.onNewIntent(i); handleTrigger(i); } private void handleTrigger(Intent i) { if (i != null && i.getData() != null) { Uri d = i.getData(); if ("safelock".equals(d.getScheme()) && "trigger120".equals(d.getHost())) { SharedPreferences p = getSharedPreferences("SafeLockPrefs", MODE_PRIVATE); if (p.getLong("lock_until", 0) <= System.currentTimeMillis()) p.edit().putLong("lock_until", System.currentTimeMillis() + LOCK_MS).apply(); } } } private void startClock() { handler.postDelayed(new Runnable() { @Override public void run() { SharedPreferences p = getSharedPreferences("SafeLockPrefs", MODE_PRIVATE); long rem = p.getLong("lock_until", 0) - System.currentTimeMillis(); if (rem > 0) { statusText.setText("FIREFOX LOCKED"); timerText.setText(String.format("%%02d:%%02d", rem/60000, (rem%%60000)/1000)); permBtn.setVisibility(View.GONE); } else { statusText.setText("READY"); timerText.setText("00:00"); permBtn.setVisibility(View.VISIBLE); } handler.postDelayed(this, 1000); } }, 200); } @Override public void onBackPressed() { if (getSharedPreferences("SafeLockPrefs", MODE_PRIVATE).getLong("lock_until", 0) <= System.currentTimeMillis()) super.onBackPressed(); } }' > app/src/main/java/com/guard/firefoxlock/MainActivity.java
          printf 'package com.guard.firefoxlock; import android.accessibilityservice.AccessibilityService; import android.content.*; import android.view.accessibility.AccessibilityEvent; import java.util.*; public class BrowserGuardService extends AccessibilityService { private static final List<String> B = Arrays.asList("org.mozilla.firefox", "org.mozilla.fenix"); @Override public void onAccessibilityEvent(AccessibilityEvent e) { if (e.getPackageName() == null) return; if (getSharedPreferences("SafeLockPrefs", MODE_PRIVATE).getLong("lock_until", 0) > System.currentTimeMillis() && B.contains(e.getPackageName().toString())) { performGlobalAction(GLOBAL_ACTION_HOME); Intent i = new Intent(this, MainActivity.class); i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP); startActivity(i); } } @Override public void onInterrupt() {} }' > app/src/main/java/com/guard/firefoxlock/BrowserGuardService.java
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FirefoxGuard120-APK
          path: app/build/outputs/apk/debug/app-debug.apk
